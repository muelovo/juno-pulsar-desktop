name: Versioned Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify SemVer matches manifests
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Version/tag mismatch" }
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json).packages[0].version
          if ($version -ne $tauri -or $version -ne $cargo) { throw "Manifest versions differ" }
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build
      - run: ./scripts/package-portable.ps1
      - name: Collect installers and hashes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe "release/Juno-Pulsar-Desktop-$version-windows-x64-setup.exe"
          Get-ChildItem release -File | Where-Object Extension -In '.exe','.zip' | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-release
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Extension -in ".exe", ".zip" -or $_.Name -eq "SHA256SUMS.txt" } | Select-Object -ExpandProperty FullName)
          gh release view $env:GITHUB_REF_NAME --json isDraft > existing-release.json
          if ($LASTEXITCODE -eq 0) {
            if (-not (Get-Content existing-release.json -Raw | ConvertFrom-Json).isDraft) { throw "Refusing to replace published release assets" }
            gh release upload $env:GITHUB_REF_NAME @assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME --draft --prerelease --title "Juno Pulsar Desktop $env:GITHUB_REF_NAME" --notes-file docs/M3.md @assets
          }
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed" }

