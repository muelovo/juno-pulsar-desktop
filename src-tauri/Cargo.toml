[package]
name = "juno-pulsar-desktop"
version = "0.1.0"
description = "An unofficial, local-only desktop companion"
authors = ["Juno Pulsar Desktop contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.89"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_SystemServices"] }
uuid = { version = "1", features = ["v4"] }
winreg = "0.55"
windows-core = "0.61"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
rfd = "0.15"
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
[dev-dependencies]
tempfile = "3"
